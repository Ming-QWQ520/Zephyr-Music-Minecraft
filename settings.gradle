pluginManagement {
    repositories {
        // BMCLAPI mirror first (fast, reliable in restricted networks)
        maven {
            name = 'MinecraftForgeMirror'
            url = 'https://bmclapi2.bangbang93.com/maven/'
        }
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}
